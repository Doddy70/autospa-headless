name: CI

# The check of the code on every push and on every pull request.
#
# It is the same gate the deployment uses: the types have to be clean and the
# site has to build. The deployment itself lives in `deploy.yml` - it needs
# the secrets of the production, the check does not.

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Typecheck and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - run: npm run typecheck
        env:
          NEXT_TELEMETRY_DISABLED: '1'
      - run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: '1'
          NEXT_PUBLIC_SITE_URL: https://autospajakarta.com
